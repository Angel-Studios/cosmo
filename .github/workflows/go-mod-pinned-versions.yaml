name: Check Go module pinned versions
on:
  pull_request:
    paths:
      - 'router/go.mod'
      - 'router/go.sum'
      - 'router-tests/go.mod'
      - 'router-tests/go.sum'
      - '.github/workflows/go-mod-pinned-versions.yaml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fail if the watched engine is not pinned to a tagged release
        env:
          MODULES: 'github.com/wundergraph/graphql-go-tools'
          DIRS: 'router router-tests'
          ALLOWED_REPLACEMENT: 'github.com/Angel-Studios/graphql-go-tools'
        run: |
          set -euo pipefail
          # Go pseudo-version suffix: YYYYMMDDHHMMSS-<12 hex chars>, preceded by '-' or '.'
          PSEUDO='[0-9]{14}-[0-9a-f]{12}'
          TAG='v[0-9]+\.[0-9]+\.[0-9]+(-[0-9a-zA-Z.]+)?'
          failed=0
          for dir in $DIRS; do
            for mod in $MODULES; do
              # go.mod / go.sum lines referencing a commit hash pseudo-version
              for f in "$dir/go.mod" "$dir/go.sum"; do
                if grep -nE "^[[:space:]]*${mod}(/v[0-9]+)?[[:space:]]+v[0-9]+\.[0-9]+\.[0-9]+(-[0-9a-zA-Z.]*)?[.-]${PSEUDO}" "$f"; then
                  echo "::error file=$f::$mod is pinned to a commit hash, use a tagged release"
                  failed=1
                fi
              done
              if grep -nE "^[[:space:]]*(replace[[:space:]]+)?${mod}(/v[0-9]+)?([[:space:]]+v[^[:space:]]+)?[[:space:]]*=>" "$dir/go.mod"; then
                line=$(grep -E "^[[:space:]]*(replace[[:space:]]+)?${mod}(/v[0-9]+)?([[:space:]]+v[^[:space:]]+)?[[:space:]]*=>" "$dir/go.mod" | head -1)
                if ! printf '%s' "$line" | grep -qE "=>[[:space:]]+${ALLOWED_REPLACEMENT}/v[0-9]+[[:space:]]+${TAG}[[:space:]]*$"; then
                  echo "::error file=$dir/go.mod::$mod may only be replaced by ${ALLOWED_REPLACEMENT} at a tagged release"
                  failed=1
                fi
                if printf '%s' "$line" | grep -qE "${PSEUDO}"; then
                  echo "::error file=$dir/go.mod::$mod replace must not use a commit pseudo-version"
                  failed=1
                fi
              fi
            done
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "All watched modules are pinned to tagged releases."
